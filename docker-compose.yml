version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: newsradar-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: newsradar
      POSTGRES_PASSWORD: newsradar_dev_password
      POSTGRES_DB: newsradar
    volumes:
      - newsradar_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U newsradar"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - newsradar

  redis:
    image: redis:7-alpine
    container_name: newsradar-redis
    restart: unless-stopped
    volumes:
      - newsradar_redisdata:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - newsradar

  api:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    container_name: newsradar-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://newsradar:newsradar_dev_password@db:5432/newsradar
      REDIS_URL: redis://redis:6379/0
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - newsradar

  worker:
    build:
      context: .
      dockerfile: packages/worker/Dockerfile
    container_name: newsradar-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://newsradar:newsradar_dev_password@db:5432/newsradar
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - newsradar

  web:
    build:
      context: .
      dockerfile: packages/web/Dockerfile
    container_name: newsradar-web
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - api
    networks:
      - newsradar

volumes:
  newsradar_pgdata:
  newsradar_redisdata:

networks:
  newsradar:
    driver: bridge
