version: "3.8"

# ==========================================
# Newsradar — Production Docker Compose
# Optimized for Coolify deployment
# ==========================================

services:
  db:
    image: postgres:16-alpine
    container_name: newsradar-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-newsradar}
      POSTGRES_PASSWORD: ${DB_PASS:?DB_PASS required}
      POSTGRES_DB: ${DB_NAME:-newsradar}
    volumes:
      - newsradar_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-newsradar}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - newsradar
    # Coolify: internal service, no public port

  redis:
    image: redis:7-alpine
    container_name: newsradar-redis
    restart: unless-stopped
    volumes:
      - newsradar_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - newsradar
    # Coolify: internal service, no public port

  api:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    container_name: newsradar-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${DB_USER:-newsradar}:${DB_PASS}@db:5432/${DB_NAME:-newsradar}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY required}
      DOMAIN: ${DOMAIN}
      # OAuth (optional — if not set, OAuth endpoints return 501)
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      YANDEX_CLIENT_ID: ${YANDEX_CLIENT_ID:-}
      YANDEX_CLIENT_SECRET: ${YANDEX_CLIENT_SECRET:-}
      # AI Platform
      PLATFORM_AI_PROVIDER: ${PLATFORM_AI_PROVIDER:-openrouter}
      PLATFORM_AI_BASE_URL: ${PLATFORM_AI_BASE_URL:-https://openrouter.ai/api/v1}
      PLATFORM_AI_MODEL: ${PLATFORM_AI_MODEL:-tencent/hy3-preview:free}
      PLATFORM_AI_API_KEY: ${PLATFORM_AI_API_KEY:-}
      # S3 (optional)
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
      # YooKassa
      YOOKASSA_SHOP_ID: ${YOOKASSA_SHOP_ID:-}
      YOOKASSA_SECRET_KEY: ${YOOKASSA_SECRET_KEY:-}
      YOOKASSA_RETURN_URL: ${YOOKASSA_RETURN_URL:-https://${DOMAIN}/subscription/success}
    ports:
      - "3001"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/api/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - newsradar

  worker:
    build:
      context: .
      dockerfile: packages/worker/Dockerfile
    container_name: newsradar-worker
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${DB_USER:-newsradar}:${DB_PASS}@db:5432/${DB_NAME:-newsradar}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      # AI
      PLATFORM_AI_PROVIDER: ${PLATFORM_AI_PROVIDER:-openrouter}
      PLATFORM_AI_BASE_URL: ${PLATFORM_AI_BASE_URL:-https://openrouter.ai/api/v1}
      PLATFORM_AI_MODEL: ${PLATFORM_AI_MODEL:-tencent/hy3-preview:free}
      PLATFORM_AI_API_KEY: ${PLATFORM_AI_API_KEY:-}
      # S3
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "healthcheck.mjs"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - newsradar
    # Coolify: background worker, no public port

  web:
    build:
      context: .
      dockerfile: packages/web/Dockerfile
    container_name: newsradar-web
    restart: unless-stopped
    ports:
      - "80"
    depends_on:
      - api
    networks:
      - newsradar
    # Coolify: static site served by nginx, port 80

volumes:
  newsradar_pgdata:
  newsradar_redisdata:

networks:
  newsradar:
    driver: bridge
